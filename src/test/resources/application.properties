# Test Application properties
spring.application.name=booking-service-test

# In-memory H2 Database for CI and Tests
spring.datasource.generate-unique-name=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT
jwt.secret=secretkeymustbe256bitslongsoitcanbesafelyusedbyhmacshaalgorithms1234567890
jwt.expiration=3600000

# Stripe Test keys
stripe.secret.key=sk_test_dummy
stripe.success.url=http://localhost:8080/api/payments/success
stripe.cancel.url=http://localhost:8080/api/payments/cancel

# Telegram Bot Test keys
telegram.bot.token=dummy_token
telegram.bot.username=dummy_bot
telegram.chat.id=123456

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=target/test-uploads

# Logging
logging.level.root=WARN
logging.level.com.accommodation.bookingservice=INFO
