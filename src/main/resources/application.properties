# Application
spring.application.name=booking-service
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_service\
?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_your_stripe_secret_key}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:8080/api/payments/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:8080/api/payments/cancel}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your_telegram_bot_token}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:your_bot_username}
telegram.chat.id=${TELEGRAM_CHAT_ID:your_chat_id}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Logging
logging.level.root=INFO
logging.level.com.accommodation.bookingservice=INFO
logging.level.org.springframework.security=INFO
